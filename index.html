<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我是智慧姐</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#FFF7F0;
            --card:#FFFFFF;
            --accent:#FF8DAA;
            --accent-2:#6EC6FF;
            --text:#3b3b3b;
            --shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        html,body{height:100%;margin:0;font-family:'Baloo 2', "Helvetica Neue", Arial, sans-serif;background:linear-gradient(180deg,var(--bg) 0%, #FFF 100%);color:var(--text);}
        .container{max-width:900px;margin:40px auto;padding:20px;}
        .header{
            display:flex;gap:20px;align-items:center;background:var(--card);padding:18px;border-radius:16px;box-shadow:var(--shadow);
        }
        .avatar{
            width:120px;height:120px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 120px;border:6px solid rgba(255,255,255,0.6);
        }
        .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
        .title{flex:1}
        .title h1{margin:0;font-size:28px;color:#222}
        .title p{margin:6px 0 0;color:#666}
        .badge{display:inline-block;padding:6px 10px;background:#FFF3F6;border-radius:12px;color:var(--accent);font-weight:700;margin-top:8px;}
        .bio-card{margin-top:18px;padding:16px;background:linear-gradient(180deg,#fff,#fff9);border-radius:12px;box-shadow:var(--shadow);}
        .grid{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:18px;}
        .gallery{display:flex;flex-wrap:wrap;gap:10px}
        .thumb{width:96px;height:96px;border-radius:12px;overflow:hidden;border:4px solid #fff;background:#f6f6f6;box-shadow:0 6px 12px rgba(0,0,0,0.04)}
        .thumb img{width:100%;height:100%;object-fit:cover}
        footer{margin-top:24px;text-align:center;color:#888;font-size:14px}
        .brush{position:fixed;right:18px;bottom:18px;width:90px;height:90px;background:conic-gradient(from 120deg,#FFD3B6,#FFB6C1,#C7E7FF);border-radius:50%;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.12));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;}
        @media (max-width:800px){.grid{grid-template-columns:1fr}.avatar{width:96px;height:96px;flex:0 0 96px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header" role="banner" aria-label="智慧姐 介绍">
            <div class="avatar" aria-hidden="false">
                <img src="ph/3cb5d99d19a2a26e3052b2a93740bcf0.jpg" alt="智慧姐 头像">
            </div>
            <div class="title">
                <h1>智慧姐</h1>
                <p>卡通风格爱好者 · 喜欢蜡笔小新与多啦A梦的温暖世界</p>
                <div class="badge">卡通·温暖·幽默</div>
            </div>
        </div>

        <div class="bio-card" role="main">
            <h2>关于智慧姐</h2>
            <p>智慧姐喜欢用简单的卡通插画记录日常生活：亲情、友情与小趣事。下面是她的一些照片与形象照。</p>

            <div class="grid">
                <div>
                    <h3>喜欢的角色</h3>
                    <ul>
                        <li>蜡笔小新（风格向）</li>
                        <li>多啦A梦（温馨向）</li>
                        <li>原创卡通形象与蜡笔风插画</li>
                    </ul>

                    <h3>小故事</h3>
                    <p>智慧姐的创作灵感来源于生活中的小细节与温暖瞬间，配色以蜡笔风为主，图像风格圆润可爱。</p>
                </div>

                <aside>
                    <h3>照片集</h3>
                    <div class="gallery" aria-label="智慧姐照片集">
                        <div class="thumb"><img src="ph/3cb5d99d19a2a26e3052b2a93740bcf0.jpg" alt="智慧姐 照片 1"></div>
                        <div class="thumb"><img src="ph/6444eea1dda35ca33b01221e559c9868.jpg" alt="智慧姐 照片 2"></div>
                        <div class="thumb"><img src="ph/8d899759a52e8de6e0346c59f1074211.jpg" alt="智慧姐 照片 3"></div>
                        <div class="thumb"><img src="ph/b5027cf337b90a62622e8534a2bf8881.jpg" alt="智慧姐 照片 4"></div>
                    </div>
                </aside>
            </div>
        </div>

        <footer>
            若要更换头像或照片，请替换 ph 文件夹内对应图片（文件名不必改动），或修改 img 的 src 指向新文件。
        </footer>
    </div>

    <div class="brush" aria-hidden="true">卡通</div>

</body>
</html>
